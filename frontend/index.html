<!DOCTYPE html>
<html>
<head>
    <title>Auth</title>

    <style>
        #map {
    height: 300px;
}
        /* 🔥 PAGE */
        body {
            margin: 0;
            font-family: Arial;
            background: url("bg.jpeg") no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadePage 1s ease-in;
        }

        @keyframes fadePage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 🔥 FORM BOX */
        .box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 🔥 INPUT */
        input {
            padding: 10px;
            margin: 10px 0;
            width: 90%;
            border: none;
            border-radius: 5px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 8px #00c853;
        }

        /* 🔥 BUTTON */
        button {
            padding: 10px;
            width: 100%;
            background: #00c853;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #009624;
        }

        /* 🔥 LINKS */
        span {
            color: blue;
            cursor: pointer;
        }

        span:hover {
            text-decoration: underline;
        }

        /* 🔥 SMOOTH SWITCH */
        #signupBox, #loginBox {
            transition: opacity 0.3s ease;
        }

        /* 🔥 TOAST */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            display: none;
            font-size: 14px;
        }

        #toast.success { background: #00c853; }
        #toast.error { background: #d50000; }

        /* 🔥 LOADER */
        #loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 5px solid #ccc;
            border-top: 5px solid #00c853;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        

    </style>
</head>

<body>

<div class="box">

    <!-- SIGN UP -->
    <div id="signupBox">
        <h2>Sign Up</h2>
        <input id="newUser" placeholder="Username"><br>
        <input id="newPass" type="password" placeholder="Password"><br>
        <button onclick="signup()">Sign Up</button>
        <p>Already have account? <span onclick="showLogin()">Sign In</span></p>
    </div>

    <!-- SIGN IN -->
    <div id="loginBox" style="display:none;">
        <h2>Sign In</h2>
        <input id="loginUser" placeholder="Username"><br>
        <input id="loginPass" type="password" placeholder="Password"><br>
        <button onclick="login()">Sign In</button>
        <p>New user? <span onclick="showSignup()">Sign Up</span></p>
    </div>

</div>

<div id="toast"></div>
<div id="loader"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
